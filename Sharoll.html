<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un detalle especial para Cuca</title>
<style>
:root {
  --bg-gradient: linear-gradient(135deg, #fffde7 0%, #fff59d 100%);
  --text-main: #3e2723;
  --text-accent: #f57f17;
  --stem-color: #388e3c;
  --leaf-color: #66bb6a;
  --petal-1: #ffee58;
  --petal-2: #fbc02d;
  --core-color: #5d4037;
  box-sizing: border-box;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-gradient: linear-gradient(135deg, #1b120c 0%, #3e2723 100%);
    --text-main: #fff8e1;
    --text-accent: #ffd54f;
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: var(--bg-gradient);
  color: var(--text-main);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  position: relative;
  text-align: center;
}

.card {
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 24px;
  padding: 40px 24px;
  max-width: 480px;
  width: 90%;
  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
  z-index: 10;
  animation: fadeIn 1.5s ease-out;
}

h1 {
  font-size: clamp(1.8rem, 5vw, 2.5rem);
  font-weight: 800;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.name {
  font-size: clamp(2.2rem, 7vw, 3.2rem);
  color: var(--text-accent);
  font-family: Georgia, serif;
  font-style: italic;
  font-weight: bold;
  margin-bottom: 16px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

p {
  font-size: clamp(1.05rem, 3.5vw, 1.25rem);
  line-height: 1.6;
  opacity: 0.9;
  max-width: 36ch;
  margin: 0 auto;
}

/* Pétalos flotantes de fondo */
.petals-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.falling-petal {
  position: absolute;
  top: -10%;
  background: linear-gradient(var(--petal-1), var(--petal-2));
  border-radius: 50% 0 50% 50%;
  opacity: 0.8;
  animation: fall linear infinite;
}

@keyframes fall {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 0.9;
  }
  100% {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0.2;
  }
}

/* Jardín de girasoles/flores en la parte inferior */
.flower-field {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 180px;
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  pointer-events: none;
  z-index: 2;
}

.sunflower {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-origin: bottom center;
  animation: sway 5s ease-in-out infinite alternate;
}

.sunflower-head {
  position: relative;
  width: 70px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.sunflower-core {
  width: 32px;
  height: 32px;
  background: radial-gradient(circle, #3e2723 0%, #5d4037 100%);
  border-radius: 50%;
  z-index: 3;
  box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
}

.petal-ring {
  position: absolute;
  width: 100%;
  height: 100%;
}

.petal-leaf {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 14px;
  height: 32px;
  background: linear-gradient(to top, var(--petal-2), var(--petal-1));
  border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
  transform-origin: 50% 0%;
  margin-left: -7px;
}

.sunflower-stem {
  width: 6px;
  height: 110px;
  background: linear-gradient(to right, #2e7d32, var(--stem-color));
  border-radius: 3px;
  z-index: 1;
}

.sunflower-leaf {
  position: absolute;
  width: 24px;
  height: 14px;
  background: var(--leaf-color);
  border-radius: 100px 0;
}

.leaf-left {
  left: -20px;
  top: 50px;
  transform: rotate(-20deg);
}

.leaf-right {
  right: -20px;
  top: 70px;
  transform: rotate(100deg);
}

@keyframes sway {
  0% { transform: rotate(-4deg); }
  100% { transform: rotate(4deg); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="card">
  <h1>Para la prima más jodona de todas</h1>
  <div class="name">Sharoll</div>
  <p>Feliz día del amor y la amistad atrasado XD.</p>
</div>

<div class="petals-container" id="petals"></div>

<div class="flower-field" id="field"></div>

<script>
// Generar pétalos flotantes cayendo
const petalsContainer = document.getElementById('petals');
const petalCount = 20;

for (let i = 0; i < petalCount; i++) {
  const petal = document.createElement('div');
  petal.className = 'falling-petal';
  
  const size = Math.random() * 12 + 10;
  petal.style.width = `${size}px`;
  petal.style.height = `${size * 1.5}px`;
  
  petal.style.left = `${Math.random() * 100}%`;
  petal.style.animationDuration = `${Math.random() * 5 + 5}s`;
  petal.style.animationDelay = `${Math.random() * 5}s`;
  
  petalsContainer.appendChild(petal);
}

// Generar jardín de girasoles
const field = document.getElementById('field');
const flowerCount = Math.floor(window.innerWidth / 90);

for (let i = 0; i < Math.max(4, flowerCount); i++) {
  const flower = document.createElement('div');
  flower.className = 'sunflower';
  flower.style.animationDelay = `${Math.random() * 3}s`;
  
  const scale = 0.7 + Math.random() * 0.5;
  flower.style.transform = `scale(${scale})`;

  let petalsHTML = '';
  for (let p = 0; p < 12; p++) {
    petalsHTML += `<div class="petal-leaf" style="transform: rotate(${p * 30}deg) translateY(10px);"></div>`;
  }

  flower.innerHTML = `
    <div class="sunflower-head">
      <div class="sunflower-core"></div>
      <div class="petal-ring">${petalsHTML}</div>
    </div>
    <div class="sunflower-stem">
      <div class="sunflower-leaf leaf-left"></div>
      <div class="sunflower-leaf leaf-right"></div>
    </div>
  `;

  field.appendChild(flower);
}
</script>

</body>
</html>
